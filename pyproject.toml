[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "cfsus"
version = "0.0.0"
description = "Typed research scaffold for counterfactual susceptibility"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
  { name = "Counterfactual Susceptibility contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not model'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "model: requires explicit opt-in, immutable local model/transcoder snapshots, and the optional Stage 1A runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cfsus"]
warn_unreachable = true
