    - transcoder_all/width_16k_l0_small/layer_4.safetensors
    - transcoder_all/width_16k_l0_small/layer_5.safetensors
    - transcoder_all/width_16k_l0_small/layer_6.safetensors
    - transcoder_all/width_16k_l0_small/layer_7.safetensors
    - transcoder_all/width_16k_l0_small/layer_8.safetensors
    - transcoder_all/width_16k_l0_small/layer_9.safetensors
    - transcoder_all/width_16k_l0_small/layer_10.safetensors
